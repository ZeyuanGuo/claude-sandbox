schema_version: 1
instance: main

target:
  name: alice
  uid: 1000
  gid: 1000
  home: /home/alice

docker:
  socket: /var/run/docker.sock

gpu:
  mode: all

paths:
  persistent_home: ~/.local/share/controlled-dev-machine/home
  state: ~/.local/state/controlled-dev-machine/runtime
  audit: ~/.local/state/controlled-dev-machine/audit

storage:
  root:
    min_free_gib: 50
    min_free_percent: 5
  audit:
    min_free_gib: 200
    min_free_percent: 10
  pcap_limit_gib: 100
  plaintext_limit_gib: 50
  structured_limit_gib: 10

upstream:
  kind: http
  host: 127.0.0.1
  port: 26940
  # 必填：固定出口填写实际公网 IP/32；地址池必须由供应商明确保证。
  expected_exit_cidr:
  # 只用于记录父代理配置来源；控制器不会启动或解析它。
  config_path:

# 可选：每次 init 从本机读取这些文本配置，生成受控副本。
# Claude 提示词会与沙箱网络约束合并；shell 和 Git 配置中的代理会被清除。
# default_conda_env 是本机选择，不应在通用代码中写死。
profile:
  # IANA 时区；按本机出口环境填写，发布默认不携带地域信息。
  timezone: UTC
  claude_instructions:
  bashrc:
  login_profile:
  gitconfig:
  tmux_config:
  conda_root:
  default_conda_env:

# 直接把同名宿主 Home 挂到容器 Home。适合专用开发账号；容器内修改会立即写回宿主。
workspace:
  share_host_home: false

# 可选：通过受控同号 relay 发布一个 TCP 端口段。0.0.0.0 会监听宿主所有 IPv4 接口。
service_ports:
  bind_address: 127.0.0.1
  start: 25600
  end: 25700

mounts: []
# 按本机实际存在的路径添加项目、配置和环境，容器路径尽量保持一致。例如：
# mounts:
#   - host_path: ~/project
#     container_path: /home/alice/project
#     access: rw
#   - host_path: ~/.claude/skills
#     container_path: /home/alice/.claude/skills
#     access: rw
#   - host_path: ~/.claude/agents
#     container_path: /home/alice/.claude/agents
#     access: rw
#   - host_path: ~/.agents/skills
#     container_path: /home/alice/.agents/skills
#     access: rw
#   - host_path: ~/.codex
#     container_path: /home/alice/.codex
#     access: rw
#   - host_path: ~/.config/git
#     container_path: /home/alice/.config/git
#     access: rw
#   - host_path: ~/.ssh
#     container_path: /home/alice/.ssh
#     access: ro
#   - host_path: ~/.condarc
#     container_path: /home/alice/.condarc
#     access: rw
#   - host_path: ~/miniconda3
#     container_path: /home/alice/miniconda3
#     access: rw
