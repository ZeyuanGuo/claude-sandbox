schema_version: 1
instance: main

target:
  name: alice
  uid: 1000
  gid: 1000
  home: /home/alice

docker:
  socket: /var/run/docker.sock

gpu:
  mode: all

paths:
  persistent_home: ~/.local/share/controlled-dev-machine/home
  state: ~/.local/state/controlled-dev-machine/runtime
  audit: ~/.local/state/controlled-dev-machine/audit

storage:
  root:
    min_free_gib: 50
    min_free_percent: 5
  audit:
    min_free_gib: 200
    min_free_percent: 10
  pcap_limit_gib: 100
  plaintext_limit_gib: 50
  structured_limit_gib: 10
  # 自动轮转只删除已结束且超过保留期的本项目审计数据。
  pcap_retention_hours: 72
  plaintext_retention_hours: 72
  structured_retention_days: 30
  # 每个长期抓包点的有界环形文件预算：4 个文件，tcpdump 每个约 67 MB（配置为 64 MiB）。
  pcap_roll_size_mib: 64
  pcap_roll_files: 4

upstream:
  kind: http
  host: 127.0.0.1
  port: 11450
  # 必填：固定出口填写实际公网 IP/32；地址池必须由供应商明确保证。
  expected_exit_cidr:
  # 只用于记录父代理配置来源；控制器不会启动或解析它。
  config_path:

# 可选：把 SSH 限定到精确的 Tailscale IPv4 地址和端口。
# 这条路径不经过 HTTP 透明代理；未列出的目标仍被阻断。
ssh:
  enabled: false
  interface: tailscale0
  allowed_addresses: []
  ports: [22, 10090]

# 可选：Claude 提示词从宿主独立目录直接读写挂载。
# shell 和 Git 配置仍由 init 生成受控副本，其中的代理会被清除。
# default_conda_env 是本机选择，不应在通用代码中写死。
profile:
  # IANA 时区；按本机出口环境填写，发布默认不携带地域信息。
  timezone: UTC
  claude_instructions: ~/claude_code_config/CLAUDE.md
  bashrc:
  login_profile:
  gitconfig:
  tmux_config:
  conda_root:
  default_conda_env:

mounts: []
# 按本机实际存在的路径添加项目、配置和环境，容器路径尽量保持一致。例如：
# mounts:
#   - host_path: ~/project
#     container_path: /home/alice/project
#     access: rw
#   - host_path: ~/claude_code_config/settings.json
#     container_path: /home/alice/.claude/settings.json
#     access: rw
#   - host_path: ~/claude_code_config/rules
#     container_path: /home/alice/.claude/rules
#     access: rw
#   - host_path: ~/claude_code_config/skills
#     container_path: /home/alice/.claude/skills
#     access: rw
#   - host_path: ~/claude_code_config/agents
#     container_path: /home/alice/.claude/agents
#     access: rw
#   - host_path: ~/.agents/skills
#     container_path: /home/alice/.agents/skills
#     access: rw
#   - host_path: ~/.codex
#     container_path: /home/alice/.codex
#     access: rw
#   - host_path: ~/.config/git
#     container_path: /home/alice/.config/git
#     access: rw
#   - host_path: ~/.ssh
#     container_path: /home/alice/.ssh
#     access: ro
#   - host_path: ~/.local/share/gamma-ssh
#     container_path: /home/alice/.local/share/gamma-ssh
#     access: ro
#   - host_path: ~/.condarc
#     container_path: /home/alice/.condarc
#     access: rw
#   - host_path: ~/miniconda3
#     container_path: /home/alice/miniconda3
#     access: rw
