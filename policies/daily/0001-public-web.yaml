web_default: allow_audited_public
rules:
  - id: block-google-doh
    priority: 1
    action: block
    purpose: "阻断目标程序绕过内部 DNS 直接使用公共 DoH"
    domain_kind: suffix
    domain: dns.google
    schemes: [http, https]
    ports: [80, 443]
    methods: ["*"]
    path_prefixes: [/]
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: known-public-doh-service

