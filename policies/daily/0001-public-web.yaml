  - id: claude-webfetch-domain-check
    priority: 20
    action: allow
    purpose: "WebFetch 读取网页前的官方域名检查"
    domain_kind: exact
    domain: api.anthropic.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: ["/api/web/domain_info?domain="]
    path_match: prefix
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-webfetch-observation

  - id: claude-api-startup-hello
    priority: 30
    action: allow
    purpose: "Claude Code 交互启动时的官方零正文请求"
    domain_kind: exact
    domain: api.anthropic.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/api/hello]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-startup-observation

  - id: claude-platform-startup-hello
    priority: 40
    action: allow
    purpose: "Claude Code 交互启动时的官方零正文请求"
    domain_kind: exact
    domain: platform.claude.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/v1/oauth/hello]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-startup-observation

  - id: closed-gate-canary-review
    priority: 100
    action: review
    purpose: "本地封闭门禁专用；不会连接公网"
    domain_kind: exact
    domain: canary.test
    schemes: [http, https]
    ports: [80, 443]
    methods: ["*"]
    path_prefixes: [/]
    content_types: []
    body_max_bytes: 1048576
    tls_identity_required: true
    plaintext_required: true
    evidence: local-closed-gate
