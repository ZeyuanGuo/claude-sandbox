schema_version: 1
policy_id: strict-claude-account-login-transparent-verification
revision: 2
mode: strict
created_at: "2026-07-29T17:30:00Z"
parent_digest: 58e5267d92375bdbdffe4c8145dc70d3cd933ab3b684405d866d75380ad8750d
web_default: review
rules:
  - id: block-claude-event-logging
    priority: 10
    action: block
    purpose: "账户登录发现阶段不需要事件上报；请求仍保存在明文审计中"
    domain_kind: exact
    domain: api.anthropic.com
    schemes: [https]
    ports: [443]
    methods: [POST]
    path_prefixes: [/api/event_logging/]
    path_match: prefix
    content_types: [application/json]
    body_max_bytes: 8388608
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-account-login-observation

  - id: allow-claude-api-startup-hello
    priority: 20
    action: allow
    purpose: "已实测的 Claude Code 启动连通性检查；无请求正文"
    domain_kind: exact
    domain: api.anthropic.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/api/hello]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-account-login-observation

  - id: allow-claude-platform-startup-hello
    priority: 30
    action: allow
    purpose: "已实测的 Claude 账户登录连通性检查；无请求正文"
    domain_kind: exact
    domain: platform.claude.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/v1/oauth/hello]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-account-login-observation

  - id: allow-claude-changelog
    priority: 40
    action: allow
    purpose: "已实测的 Claude Code 官方版本说明读取；仅允许固定公开文件"
    domain_kind: exact
    domain: raw.githubusercontent.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/anthropics/claude-code/refs/heads/main/CHANGELOG.md]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-account-login-observation

  - id: allow-exit-identity-check
    priority: 45
    action: allow
    purpose: "封闭验收从目标容器确认透明 Web 路径的父代理出口；无请求正文"
    domain_kind: exact
    domain: api.ipify.org
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: [/]
    path_match: exact
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: transparent-exit-verification

  - id: review-claude-webfetch-domain-check
    priority: 50
    action: review
    purpose: "保留已知 WebFetch 域名检查，但账户登录阶段仍逐次审核"
    domain_kind: exact
    domain: api.anthropic.com
    schemes: [https]
    ports: [443]
    methods: [GET]
    path_prefixes: ["/api/web/domain_info?domain="]
    path_match: prefix
    content_types: []
    body_max_bytes: 0
    tls_identity_required: true
    plaintext_required: true
    evidence: claude-webfetch-observation
