[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-dev-machine"
version = "0.1.0"
description = "Fail-closed network control and audit for a persistent development sandbox"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
sandboxctl = "controlled_dev_machine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

